x-api-base: &api-base
  build:
    context: .
    dockerfile: Dockerfile
  image: vigilant-app:latest
  env_file:
    - .env

services:
  redis:
    container_name: ${REDIS_HOST}
    image: redis:8.6.5-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ":${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  postgres:
    container_name: ${DB_HOST}
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD}
    ports:
      - ":${DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh

  migrations:
    container_name: v-migrations
    <<: *api-base
    command: ["./vigilant-go", "-cmd=up"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    container_name: v-api
    <<: *api-base
    command: ["./vigilant-go"]
    env_file:
      - .env
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
